name: QuickReminders
options:
  bundleIdPrefix: com.nicolasblunck
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A real Development identity is required, not ad-hoc ("-"): a sandboxed app
    # signed ad-hoc has its XPC connection to the Reminders daemon refused with
    # Mach error 4099, and the TCC prompt never appears.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  QuickReminders:
    type: application
    platform: macOS
    sources:
      - path: QuickReminders
        excludes:
          - "Resources/Info.plist"
          - "Resources/QuickReminders.entitlements"
          - "Resources/AppIcon.icon"
      # An Icon Composer bundle. Declared explicitly as a file so it is compiled
      # as one icon, rather than recursed into and copied as loose json and svg.
      - path: QuickReminders/Resources/AppIcon.icon
        type: file
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # Copied into Contents/PlugIns. The app is the only thing that installs
      # the widget, so the extension is never built or shipped on its own.
      - target: QuickRemindersWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.QuickReminders
        PRODUCT_NAME: QuickReminders
        INFOPLIST_FILE: QuickReminders/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickReminders/Resources/QuickReminders.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  # The desktop widgets. Sandboxed (extensions always are) even though the app
  # is not, so everything shared with it travels through the App Group rather
  # than through the app's own container.
  QuickRemindersWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickRemindersWidget
        excludes:
          - "Resources/Info.plist"
          - "Resources/QuickRemindersWidget.entitlements"
      # Compiled in rather than shared through a framework: an embedded
      # framework would need its own signing and versioning for six small files.
      - path: QuickReminders/Filters
      - path: QuickReminders/Model/ReminderDraft.swift
        type: file
      - path: QuickReminders/Services/ReminderWriter.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.QuickReminders.Widget
        PRODUCT_NAME: QuickRemindersWidget
        INFOPLIST_FILE: QuickRemindersWidget/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickRemindersWidget/Resources/QuickRemindersWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES

  # The parser is pure Foundation, so the model sources compile straight into the
  # test bundle. That keeps `xcodebuild test` from having to launch the menu bar app.
  QuickRemindersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - QuickRemindersTests
      - QuickReminders/Model
      - QuickReminders/Filters
      # ListColor and ReminderList, which TaskItem is built out of.
      - path: QuickReminders/Services/ReminderWriter.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.QuickRemindersTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # Renders views to PNG offscreen (activation policy .prohibited), so UI can be
  # checked without a window ever appearing over the user's work.
  SnapshotTool:
    type: tool
    platform: macOS
    sources:
      - QuickReminders/Model
      - QuickReminders/Services/ReminderWriter.swift
      - QuickReminders/Services/RemindersService.swift
      - QuickReminders/Services/Preferences.swift
      - QuickReminders/Views/ListPickerView.swift
      - QuickReminders/Views/ParsedChipsView.swift
      - QuickReminders/Views/CalendarGridView.swift
      - QuickReminders/Views/DatePopoverView.swift
      - QuickReminders/Views/TimePopoverView.swift
      - QuickReminders/Views/PriorityMarksView.swift
      - QuickReminders/Views/QuickEntryView.swift
      - QuickReminders/Views/Filters/SymbolPickerView.swift
      - QuickReminders/Views/Filters/ConditionEditorView.swift
      - QuickReminders/Views/Filters/FilterEditorView.swift
      - QuickReminders/Filters
      # The widget views, minus the bundle file — its `@main` would fight the
      # tool's own entry point.
      - path: QuickRemindersWidget/FilterWidgetView.swift
        type: file
      - path: QuickRemindersWidget/FilterTimelineProvider.swift
        type: file
      - path: QuickRemindersWidget/SelectFilterIntent.swift
        type: file
      - path: QuickRemindersWidget/CompleteTaskIntent.swift
        type: file
      - Snapshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.QuickRemindersSnapshot
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  SnapshotTool:
    build:
      targets:
        SnapshotTool: all
    run:
      config: Debug

  QuickReminders:
    build:
      targets:
        QuickReminders: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuickRemindersTests
